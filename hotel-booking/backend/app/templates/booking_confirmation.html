{% extends "notification_base.html" %}
{% block content %}
<h1 style="font-weight: 900; color: #1e293b; margin-bottom: 24px;">Your stay is confirmed.</h1>
<p style="color: #64748b; font-size: 18px; line-height: 28px;">Get ready for Bhutan! Your reservation at <strong>{{ hotel_name }}</strong> is officially booked.</p>

<div style="background: #eff6ff; border-radius: 16px; padding: 24px; margin: 32px 0;">
  <p style="margin: 0; color: #1d4ed8; font-weight: bold; font-size: 14px; text-transform: uppercase;">Check-in window</p>
  <p style="margin: 8px 0 0 0; font-size: 20px; font-weight: bold;">{{ check_in }}</p>
</div>

<p style="font-size: 14px; color: #94a3b8;">Staff on shift for your arrival: <strong>{{ shift_staff }}</strong></p>
{% endblock %}
