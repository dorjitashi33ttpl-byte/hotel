version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hotel_booking
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always

  backend:
    build: ./backend
    restart: always
    environment:
      POSTGRES_SERVER: db
      REDIS_HOST: redis
      SQLALCHEMY_DATABASE_URI: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/hotel_booking
    ports:
      - "80:8000"
    depends_on:
      - db
      - redis

  worker:
    build: ./backend
    command: celery -A app.worker.tasks worker --loglevel=info
    depends_on:
      - redis
      - db

volumes:
  postgres_prod_data:
